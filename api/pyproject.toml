[project]
name = "oxhack-api"
version = "0.1.0"
description = "HTTP API for the OxHack '26 drug repurposing app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  # Stream A (pipeline/ and jury/ at the repository root): the live evidence
  # pipeline and the Model jury.
  "oxhack-drug-repurposing",
  # Stream B (ranking/ at the repository root): the network-proximity ranking.
  "oxhack-ranking",
  "psycopg-pool>=3.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "starlette>=1.10,<2",
  "typing-extensions>=4.12",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  # The test client. Starlette 1.2+ uses httpx2 and deprecates plain httpx.
  "httpx2>=2.16",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv.sources]
oxhack-drug-repurposing = { workspace = true }
oxhack-ranking = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oxhack_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = ["network: calls Open Targets and needs `python -m oxhack_api.prepare` data; run with -m network"]
# db/ holds migrate.py and the throwaway-Postgres helpers shared with db/tests.
pythonpath = ["../db"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET"]
# Domain errors are named for the outcome (NotFound, Conflict), not "...Error".
ignore = ["N818"]

[tool.pyright]
include = ["oxhack_api", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# The uv workspace keeps one .venv at the repository root.
venvPath = ".."
venv = ".venv"
extraPaths = ["../db"]
