# Required branch-protection check: test. Docs-only changes still report this check.
name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks, but never interrupt an in-progress deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Detect runtime changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [[ "$EVENT" != workflow_dispatch ]]; then
            base=${BASE:-$BEFORE}
            if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
              code=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md|LICENSE|.trail/*|.agents/*|.claude/*) ;;
                  *) code=true ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Runtime changes: $code" >> "$GITHUB_STEP_SUMMARY"

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: API lint, types and tests
        working-directory: api
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync pyright
          uv run --no-sync pytest -q
      - name: Pipeline and ranking tests
        run: uv run --no-sync pytest tests ranking/tests -q
      - name: Docking queue tests (no Vina required)
        working-directory: worker
        run: uv run --no-sync pytest -q
      - name: Database migrations
        run: uv run --no-sync pytest db/tests -q
      - name: Deployment script regression tests
        run: |
          uv run --no-sync ruff check scripts/oracle scripts/tests/test_oracle.py db/tests/test_oracle_restore.py
          uv run --no-sync ruff format --check scripts/oracle scripts/tests/test_oracle.py db/tests/test_oracle_restore.py
          uv run --no-sync pytest scripts/tests -q

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OXHACK_SOURCE: fixture
      OXHACK_JURY: fixture
      OXHACK_DOCKING: fixture
      OXHACK_REPO: memory
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: npm ci
        working-directory: web
      - name: Web checks and unit tests
        working-directory: web
        run: |
          npm run check:api
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests against the real fixture API and built app
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  oracle:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate free resource guards without cloud credentials
        run: |
          terraform -chdir=infra/oracle init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/oracle fmt -check
          terraform -chdir=infra/oracle validate
          terraform -chdir=infra/oracle test
          shellcheck -e SC1091 scripts/oracle/*.sh

  # A stable required check succeeds on docs-only changes and fails closed on cancelled jobs.
  test:
    needs: [changes, python, web, oracle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PYTHON: ${{ needs.python.result }}
          WEB: ${{ needs.web.result }}
          ORACLE: ${{ needs.oracle.result }}
        run: |
          [[ "$CHANGES" == success ]]
          if [[ "$CODE" == true ]]; then
            [[ "$PYTHON" == success && "$WEB" == success && "$ORACLE" == success ]]
          else
            [[ "$CODE" == false && "$PYTHON" == skipped && "$WEB" == skipped && "$ORACLE" == skipped ]]
          fi

  deployment-status:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.ORACLE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report pending Oracle setup
        run: |
          echo '::notice::Checks passed. Oracle deployment is waiting for one-time account and server setup.'
          echo 'Oracle deployment is disabled until scripts/oracle/configure-ci.sh is run with --enable. See infra/oracle/README.md.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.ORACLE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy the tested archive to Oracle
        env:
          DEPLOY_SHA: ${{ github.sha }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ ! "$ORACLE_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ || -z "$ORACLE_SSH_KEY" || -z "$ORACLE_KNOWN_HOSTS" ]]; then
            echo '::error::Oracle SSH settings are incomplete. Run scripts/oracle/configure-ci.sh (infra/oracle/README.md).'
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/oracle' EXIT
          ssh_opts=(-i ~/.ssh/oracle -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          git archive --format=tar.gz --output="$RUNNER_TEMP/release.tgz" "$DEPLOY_SHA"
          digest=$(sha256sum "$RUNNER_TEMP/release.tgz" | cut -d ' ' -f 1)
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/release.tgz" \
            "halflife@$ORACLE_HOST:/srv/half-life/incoming/$DEPLOY_SHA.tgz"
          scp "${ssh_opts[@]}" scripts/oracle/deploy.sh \
            "halflife@$ORACLE_HOST:/srv/half-life/incoming/deploy-$DEPLOY_SHA.sh"
          ssh "${ssh_opts[@]}" "halflife@$ORACLE_HOST" \
            "bash /srv/half-life/incoming/deploy-$DEPLOY_SHA.sh $DEPLOY_SHA /srv/half-life/incoming/$DEPLOY_SHA.tgz $digest" < /dev/null
      - name: Verify the public release SHA
        env:
          URL: ${{ vars.DEMO_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          [[ "$URL" == https://* ]]
          curl --connect-timeout 5 --max-time 15 -fsS "${URL%/}/release.json" | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)["sha"]==sys.argv[1]' "$DEPLOY_SHA"
      - name: Check the public API answers
        env:
          URL: ${{ vars.DEMO_URL }}
        run: |
          [[ "$URL" == https://* ]]
          for _ in $(seq 1 30); do
            if curl --connect-timeout 5 --max-time 10 -fsS "${URL%/}/api/health" | \
              python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public demo API failed its health check.'
          exit 1
