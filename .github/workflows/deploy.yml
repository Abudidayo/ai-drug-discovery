# Required branch-protection check: test. Docs-only changes still report this check.
name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks, but never interrupt an in-progress deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Detect runtime changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [[ "$EVENT" != workflow_dispatch ]]; then
            base=${BASE:-$BEFORE}
            if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
              code=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md|LICENSE|.trail/*|.agents/*|.claude/*) ;;
                  *) code=true ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Runtime changes: $code" >> "$GITHUB_STEP_SUMMARY"

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: API lint, types and tests
        working-directory: app/api
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync pyright
          uv run --no-sync pytest -q
      - name: Pipeline, jury and ranking tests
        run: uv run --no-sync pytest tests core -q
      - name: Docking queue tests (no Vina required)
        working-directory: app/worker
        run: uv run --no-sync pytest -q
      - name: Database migrations
        run: uv run --no-sync pytest deploy/db/tests -q
      - name: Deployment script regression tests
        run: |
          uv run --no-sync ruff check deploy/vercel
          uv run --no-sync ruff format --check deploy/vercel
          uv run --no-sync pytest deploy/tests -q
          shellcheck -e SC1091 deploy/*.sh

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OXHACK_SOURCE: fixture
      OXHACK_JURY: fixture
      OXHACK_DOCKING: fixture
      OXHACK_REPO: memory
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: npm ci
        working-directory: app/web
      - name: Web checks and unit tests
        working-directory: app/web
        run: |
          npm run check:api
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
      - name: Install browser
        working-directory: app/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests against the real fixture API and built app
        working-directory: app/web
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            app/web/playwright-report/
            app/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # A stable required check succeeds on docs-only changes and fails closed on cancelled jobs.
  test:
    needs: [changes, python, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PYTHON: ${{ needs.python.result }}
          WEB: ${{ needs.web.result }}
        run: |
          [[ "$CHANGES" == success ]]
          if [[ "$CODE" == true ]]; then
            [[ "$PYTHON" == success && "$WEB" == success ]]
          else
            [[ "$CODE" == false && "$PYTHON" == skipped && "$WEB" == skipped ]]
          fi

  # Docs-only pushes skip python and web; without !cancelled(), GitHub would skip
  # these too, because a job any ancestor of which was skipped is skipped.
  deployment-status:
    needs: test
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (vars.VERCEL_PROJECT_ID == '' || vars.DATA_RELEASE == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report pending Vercel setup
        run: |
          echo '::notice::Checks passed. Deployment waits for the Vercel project settings and the data release.'
          echo 'Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID and DATA_RELEASE (deploy/vercel/README.md) to deploy main.' >> "$GITHUB_STEP_SUMMARY"

  # Every passing push to main deploys that exact commit. Pull requests never deploy.
  deploy:
    needs: test
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.VERCEL_PROJECT_ID != '' && vars.DATA_RELEASE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.DEMO_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Fetch the prepared data
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_RELEASE: ${{ vars.DATA_RELEASE }}
        run: |
          gh release download "$DATA_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern 'data.tar.gz' --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/data"
          tar -xzf "$RUNNER_TEMP/data.tar.gz" -C "$RUNNER_TEMP/data"
      - name: Build and deploy the tested commit to Vercel
        id: deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          uv run deploy/vercel/build.py --data "$RUNNER_TEMP/data" --sha "$DEPLOY_SHA" --out "$RUNNER_TEMP/deploy"
          cd "$RUNNER_TEMP/deploy"
          # Vercel builds it on Linux: a prebuilt upload would add the Python packages'
          # thousands of files, past the Hobby plan's 5,000 uploaded files a day.
          npx --yes vercel@65.3.1 deploy --prod --yes --token "$VERCEL_TOKEN"
      # A deploy that fails these checks is rolled back to the previous production one.
      - name: Verify the public release SHA
        env:
          URL: ${{ vars.DEMO_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          [[ "$URL" == https://* ]]
          for _ in $(seq 1 24); do
            if curl --connect-timeout 5 --max-time 15 -fsS "${URL%/}/release.json" | \
              python3 -c 'import json,sys; assert json.load(sys.stdin)["sha"]==sys.argv[1]' "$DEPLOY_SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public site does not serve the deployed commit.'
          exit 1
      - name: Check the public API answers
        env:
          URL: ${{ vars.DEMO_URL }}
        run: |
          [[ "$URL" == https://* ]]
          for _ in $(seq 1 30); do
            if curl --connect-timeout 5 --max-time 30 -fsS "${URL%/}/api/health" | \
              python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public API failed its health check.'
          exit 1
      - name: Roll back a failed deploy
        if: failure() && steps.deploy.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        working-directory: ${{ runner.temp }}/deploy
        run: |
          npx --yes vercel@65.3.1 rollback --yes --token "$VERCEL_TOKEN"
          echo '::error::The deploy failed its checks; production was rolled back to the previous deployment.'
