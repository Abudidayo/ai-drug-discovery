[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oxhack-ranking"
version = "0.1.0"
description = "Offline protein-network foundation for OxHack Stream B"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "scipy==1.17.1"]

[tool.setuptools]
packages = ["ranking"]
package-dir = {ranking = "."}
