[project]
name = "oxhack-drug-repurposing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet access; run with -m network"]

# --- Added for workstream C (please approve, Jessica) -------------------------
# Makes pipeline/ and jury/ an installable package, so the API (api/) depends on
# them instead of copying them, and joins api/ into one uv workspace: one .venv
# and one uv.lock at the repository root. Nothing above this line changed.
# ranking/ (stream B) is a member too, so the API imports its engine.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "jury"]

[tool.uv.workspace]
members = ["api", "ranking", "worker"]
