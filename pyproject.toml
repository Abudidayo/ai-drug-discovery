[project]
name = "oxhack-drug-repurposing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet access; run with -m network"]
